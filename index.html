<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Scores</title><meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Scores">
<style>
:root{--bg:#0d0f14;--card:#171a22;--line:#262a35;--tx:#e8eaf0;--mut:#8b91a1;--acc:#3b82f6;--live:#ef4444;--win:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 6px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 6px;display:flex;align-items:center;gap:8px}.pulse{width:9px;height:9px;border-radius:50%;background:var(--live);animation:p 1.4s infinite;display:inline-block}
@keyframes p{0%{box-shadow:0 0 0 0 #ef444499}70%{box-shadow:0 0 0 8px #ef444400}100%{box-shadow:0 0 0 0 #ef444400}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 11px;font-size:13px}.chip.on{background:var(--acc);border-color:var(--acc)}
.bar{display:flex;align-items:center;gap:6px;margin-top:4px}.bar button,.bar input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit}
.bar input{color-scheme:dark;flex:1}main{padding:10px 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.game{cursor:pointer}.row{display:flex;align-items:center;gap:8px;padding:3px 0}.row img{width:24px;height:24px;object-fit:contain}.row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-weight:700;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}.lose{color:var(--mut)}.rec{color:var(--mut);font-size:12px;margin-left:4px}
.st{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:4px}.st .live{color:var(--live);font-weight:700}
.mut{color:var(--mut);font-size:13px}.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#11141bf2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;font-size:11px}nav button b{display:block;font-size:19px;font-weight:400}nav button.on{color:var(--acc)}
.news{display:flex;gap:10px;text-decoration:none;color:inherit}.news img{width:96px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:#222}.news h3{font-size:14px;margin:0 0 4px;line-height:1.3}
.banner{background:#3a2a0a;color:#fcd34d;border-radius:8px;padding:7px 10px;font-size:13px;margin-bottom:8px}
#sheet{position:fixed;inset:0;background:#000a;z-index:9;display:none}#sheet.on{display:block}#sheet .in{position:absolute;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}td,th{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
.star{background:none;border:0;color:#fbbf24;font-size:20px;cursor:pointer}.x{float:right;background:var(--card);border:0;color:var(--tx);border-radius:50%;width:30px;height:30px;font-size:16px}
.lnk{color:#93c5fd;cursor:pointer}.empty{text-align:center;color:var(--mut);padding:30px 10px}.lb td{text-align:left}
</style></head><body>
<header><h1><span id="ttl">Scores</span><span id="pl"></span><span style="flex:1"></span><span id="upd" class="mut"></span></h1><div id="hdr"></div></header>
<main id="app"></main><div id="sheet"><div class="in" id="sheetIn"></div></div>
<nav id="nav"></nav>
<script>
const WEB='https://site.web.api.espn.com/apis/common/v3/sports/',API='https://site.api.espn.com/apis/site/v2/sports/',API2='https://site.api.espn.com/apis/v2/sports/';
const L=[['nfl','NFL','football/nfl','team','🏈'],['mlb','MLB','baseball/mlb','team','⚾'],['nba','NBA','basketball/nba','team','🏀'],['cfb','NCAAF','football/college-football','team','🏈'],['cbb','NCAAM','basketball/mens-college-basketball','team','🏀']]
.map(([id,name,path,kind,em])=>({id,name,path,kind,em}));const LG=Object.fromEntries(L.map(l=>[l.id,l]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S={tab:ls('tab','mine'),lg:ls('lg','nfl'),date:null,favs:ls('favs',[]),stale:null,live:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const tm=s=>new Date(s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),dt=s=>new Date(s).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
async function getJ(url,maxAge=0){const k='c:'+url,c=ls(k,null);if(c&&!navigator.onLine){S.stale=Math.min(S.stale||Infinity,c.t);return c.d}if(c&&Date.now()-c.t<maxAge)return c.d;
 try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();ss(k,{t:Date.now(),d});return d}
 catch(e){if(c){S.stale=Math.min(S.stale||Infinity,c.t);return c.d}throw e}}
function prune(){const ks=Object.keys(localStorage).filter(k=>k.startsWith('c:'));if(ks.length>60)ks.map(k=>[k,ls(k,{t:0}).t]).sort((a,b)=>a[1]-b[1]).slice(0,ks.length-60).forEach(([k])=>localStorage.removeItem(k))}
const isFav=(lg,id)=>S.favs.some(f=>f.lg===lg&&f.id===String(id));
function toggleFav(lg,t){const i=S.favs.findIndex(f=>f.lg===lg&&f.id===String(t.id));if(i>=0)S.favs.splice(i,1);else S.favs.push({lg,id:String(t.id),name:t.displayName||t.name,logo:t.logo||(t.logos&&t.logos[0]&&t.logos[0].href)||''});ss('favs',S.favs)}
// ---- normalize scoreboard events into cards
function norm(lg,ev){const st=ev.status||{},ty=st.type||{};const out=[];
 const c=ev.competitions[0],cs=c.status||st;out.push({lg,ev,id:ev.id,kind:'team',state:(cs.type||ty).state,detail:(cs.type||ty).shortDetail,date:ev.date,
  teams:c.competitors.slice().sort((a,b)=>a.homeAway==='away'?-1:1).map(k=>({id:k.team.id,name:k.team.shortDisplayName||k.team.displayName,full:k.team.displayName,logo:k.team.logo,score:k.score,win:k.winner,rec:k.records&&k.records[0]&&k.records[0].summary,rank:k.curatedRank&&k.curatedRank.current<99?k.curatedRank.current:''})),
  odds:c.odds&&c.odds[0]&&c.odds[0].details,tv:c.broadcasts&&c.broadcasts[0]&&c.broadcasts[0].names&&c.broadcasts[0].names.join('/'),note:c.notes&&c.notes[0]&&c.notes[0].headline});return out}
function stHTML(g){const live=g.state==='in';return `<div class="st"><span class="${live?'live':''}">${live?'● ':''}${esc(g.state==='pre'?dt(g.date)+' · '+tm(g.date):g.detail)}</span><span>${esc(g.tv||g.odds||'')}</span></div>`}
function gameHTML(g){let h=`<div class="card game" data-g="${esc(g.lg.id)}|${esc(g.id)}">`+stHTML(g);
 g.teams.forEach(t=>{const lose=g.state==='post'&&g.teams.some(o=>o.win)&&!t.win;h+=`<div class="row ${lose?'lose':''}">${t.logo?`<img loading="lazy" src="${esc(t.logo)}" alt="">`:''}<span class="n">${t.rank?`<span class="mut">${t.rank}</span> `:''}${esc(t.name)}${isFav(g.lg.id,t.id)?' ⭐':''}<span class="rec">${esc(t.rec||'')}</span></span><span class="s">${g.state==='pre'?'':esc(t.score??'')}</span></div>`})
 if(g.note)h+=`<div class="mut" style="margin-top:3px">${esc(g.note)}</div>`;return h+'</div>'}
const order={in:0,pre:1,post:2};
async function scoreboard(lg,date){const d=await getJ(API+lg.path+'/scoreboard'+(date?'?dates='+date:''),10e3);let gs=[].concat(...(d.events||[]).map(e=>norm(lg,e)));return gs}
const GAMES={};
// ---- views
async function vScores(){const lg=LG[S.lg];const gs=await scoreboard(lg,S.date);gs.forEach(g=>GAMES[g.lg.id+'|'+g.id]=g);S.live=gs.some(g=>g.state==='in');
 gs.sort((a,b)=>order[a.state]-order[b.state]||new Date(a.date)-new Date(b.date));
 return gs.length?gs.map(gameHTML).join(''):`<div class="empty">No ${esc(lg.name)} events on this date.</div>`}
async function vMine(){if(!S.favs.length)return `<div class="empty">⭐ No favorite teams yet.<br><br>Open any game or the Standings tab and tap the star next to a team to pin it here.</div>`;
 const lgs=[...new Set(S.favs.map(f=>f.lg))];let h='';const all=[],news=[];
 await Promise.all(lgs.map(async id=>{const lg=LG[id];try{const gs=await scoreboard(lg,null);gs.forEach(g=>{GAMES[g.lg.id+'|'+g.id]=g;if(g.teams&&g.teams.some(t=>isFav(id,t.id)))all.push(g)})}catch(e){}
  try{const n=await getJ(API+lg.path+'/news?limit=30',120e3);(n.articles||[]).forEach(a=>{if((a.categories||[]).some(c=>c.teamId&&isFav(id,c.teamId)))news.push(a)})}catch(e){}}));
 S.live=all.some(g=>g.state==='in');all.sort((a,b)=>order[a.state]-order[b.state]||new Date(a.date)-new Date(b.date));
 h+=`<div class="chips">${S.favs.map(f=>`<span class="chip" data-t="${esc(f.lg)}|${esc(f.id)}">${f.logo?`<img src="${esc(f.logo)}" style="width:16px;height:16px;vertical-align:-3px"> `:''}${esc(f.name)}</span>`).join('')}</div><div class="sec">Games</div>`;
 h+=all.length?all.map(gameHTML).join(''):'<div class="mut card">No games this week for your teams.</div>';
 news.sort((a,b)=>new Date(b.published)-new Date(a.published));h+='<div class="sec">News</div>'+(news.length?news.slice(0,15).map(newsHTML).join(''):'<div class="mut card">No recent headlines for your teams.</div>');return h}
function newsHTML(a){const img=a.images&&a.images[0]&&a.images[0].url,href=a.links&&a.links.web&&a.links.web.href;
 return `<a class="card news" href="${esc(href||'#')}" target="_blank" rel="noopener">${img?`<img loading="lazy" src="${esc(img)}" alt="">`:''}<div><h3>${esc(a.headline)}</h3><div class="mut">${a.published?ago(new Date(a.published)):''}${a.type?' · '+esc(a.type):''}</div></div></a>`}
async function vNews(){const lg=LG[S.lg];const n=await getJ(API+lg.path+'/news?limit=30',60e3);const a=n.articles||[];return a.length?a.map(newsHTML).join(''):'<div class="empty">No headlines.</div>'}
function groups(n,acc=[]){if(n.standings&&n.standings.entries)acc.push(n);(n.children||[]).forEach(c=>groups(c,acc));return acc}
async function vStand(){const lg=LG[S.lg];
 const d=await getJ(API2+lg.path+'/standings',300e3);const gs=groups(d);if(!gs.length)return '<div class="empty">No standings available.</div>';
 const cols=[['wins','W'],['losses','L'],['winPercent','PCT'],['gamesBehind','GB']];
 return gs.map(g=>{const es=g.standings.entries.slice();const sv=(e,n)=>{const s=e.stats.find(x=>x.name===n||x.type===n.toLowerCase());return s?s.displayValue:''};
  const key='winPercent';es.sort((a,b)=>{const f=e=>{const s=e.stats.find(x=>x.name===key);return s?s.value:0};return f(b)-f(a)});
  return `<div class="sec">${esc(g.name)}</div><div class="card" style="padding:4px 8px"><table><tr><th>Team</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>${es.map(e=>`<tr><td>${e.team.logos&&e.team.logos[0]?`<img src="${esc(e.team.logos[0].href)}" style="width:18px;height:18px;vertical-align:-4px"> `:''}${tlink(lg.id,e.team.id,e.team.shortDisplayName||e.team.displayName)}</td>${cols.map(c=>`<td>${esc(sv(e,c[0]))}</td>`).join('')}<td><button class="star" data-fav='${esc(JSON.stringify({lg:lg.id,id:e.team.id,displayName:e.team.displayName,logo:e.team.logos&&e.team.logos[0]&&e.team.logos[0].href}))}'>${isFav(lg.id,e.team.id)?'★':'☆'}</button></td></tr>`).join('')}</table></div>`}).join('')}
// ---- detail sheet
function detail(key){openSheet(()=>detailView(key))}
async function detailView(key){const g=GAMES[key];if(!g)return;const box=document.getElementById('sheetIn');
 let h=top_()+`<div class="mut">${esc(g.lg.em+' '+g.lg.name)}</div>`;

 box.innerHTML=h+'<div class="empty">Loading…</div>';let s;try{s=await getJ(API+g.lg.path+'/summary?event='+g.ev.id,10e3)}catch(e){box.innerHTML=h+'<div class="empty">Couldn\'t load game details. Check your connection.</div>';return}
 const c=s.header&&s.header.competitions[0]||{};const cps=(c.competitors||[]).slice().sort((a,b)=>a.homeAway==='away'?-1:1);
 h+=stHTML(g);h+=cps.map(k=>`<div class="row"><img src="${esc(k.team.logos&&k.team.logos[0]&&k.team.logos[0].href||'')}" alt=""><span class="n">${tlink(g.lg.id,k.team.id,k.team.displayName)}</span><span class="s">${esc(k.score??'')}</span><button class="star" data-fav='${esc(JSON.stringify({lg:g.lg.id,id:k.team.id,displayName:k.team.displayName,logo:k.team.logos&&k.team.logos[0]&&k.team.logos[0].href}))}'>${isFav(g.lg.id,k.team.id)?'★':'☆'}</button></div>`).join('');
 const n=Math.max(0,...cps.map(k=>(k.linescores||[]).length));if(n)h+=`<div class="sec">Line score</div><div class="card" style="padding:4px 8px"><table><tr><th></th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th>T</th></tr>${cps.map(k=>`<tr><td>${esc(k.team.abbreviation)}</td>${Array.from({length:n},(_,i)=>`<td>${esc((k.linescores[i]||{}).displayValue??'')}</td>`).join('')}<td><b>${esc(k.score??'')}</b></td></tr>`).join('')}</table></div>`;
 const pc=s.pickcenter&&s.pickcenter[0];if(pc&&(pc.details||pc.overUnder))h+=`<div class="sec">Odds</div><div class="card">${esc(pc.details||'')}${pc.overUnder?' · O/U '+esc(pc.overUnder):''}<span class="mut"> ${esc(pc.provider&&pc.provider.name||'')}</span></div>`;
 const ld=(s.leaders||[]).filter(t=>t.leaders&&t.leaders.length);if(ld.length)h+=`<div class="sec">Leaders</div>`+ld.map(t=>`<div class="card"><b>${esc(t.team&&t.team.displayName)}</b>${t.leaders.slice(0,4).map(x=>{const a=x.leaders&&x.leaders[0];return a?`<div class="row"><span class="mut" style="width:90px">${esc(x.displayName)}</span><span class="n">${plink(g.lg.id,a.athlete&&a.athlete.id,a.athlete&&a.athlete.displayName)}</span><span class="mut">${esc(a.displayValue)}</span></div>`:''}).join('')}</div>`).join('');
 const bt=s.boxscore&&s.boxscore.teams||[];if(bt.length===2&&bt[0].statistics&&bt[0].statistics.length){const st0=bt[0].statistics;h+=`<div class="sec">Team stats</div><div class="card" style="padding:4px 8px"><table><tr><th></th><th>${esc(bt[0].team.abbreviation)}</th><th>${esc(bt[1].team.abbreviation)}</th></tr>${st0.map(x=>{const y=(bt[1].statistics||[]).find(z=>z.name===x.name)||{};return `<tr><td>${esc(x.label||x.name)}</td><td>${esc(x.displayValue)}</td><td>${esc(y.displayValue)}</td></tr>`}).join('')}</table></div>`}
 h+=boxHTML(g.lg.id,s);
 let plays=(s.scoringPlays&&s.scoringPlays.length?s.scoringPlays:null)||s.keyEvents||(s.plays||[]).slice(-15);if(plays&&plays.length){plays=plays.slice().reverse().slice(0,20);h+=`<div class="sec">${s.scoringPlays&&s.scoringPlays.length?'Scoring plays':'Plays'}</div><div class="card">${plays.map(p=>`<div style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="mut">${esc((p.period&&(p.period.displayValue||('P'+p.period.number)))||'')} ${esc(p.clock&&p.clock.displayValue||'')}</span> ${esc(p.text||p.type&&p.type.text||'')}</div>`).join('')}</div>`}
 const nw=s.news&&s.news.articles;if(nw&&nw.length)h+='<div class="sec">News</div>'+nw.slice(0,4).map(newsHTML).join('');box.innerHTML=h}

const STACK=[];function openSheet(fn){STACK.push(fn);document.getElementById('sheet').classList.add('on');fn()}
function back(){STACK.pop();const f=STACK[STACK.length-1];f?f():closeSheet()}
const top_=t=>`<button class="x" onclick="closeSheet()">✕</button>${STACK.length>1?'<button class="x" style="float:left;margin-right:8px" onclick="back()">‹</button>':''}`;
const tlink=(lg,id,name)=>`<span class="lnk" data-t="${esc(lg)}|${esc(id)}">${esc(name)}</span>`,plink=(lg,id,name)=>id?`<span class="lnk" data-p="${esc(lg)}|${esc(id)}">${esc(name)}</span>`:esc(name);
function boxHTML(lg,s){const ps=s.boxscore&&s.boxscore.players||[];if(!ps.length)return '';let h='<div class="sec">Player stats</div>';
 ps.forEach(tp=>{h+=`<div class="card" style="padding:6px 8px;overflow-x:auto"><b>${esc(tp.team.displayName)}</b>`;(tp.statistics||[]).forEach(c=>{const at=(c.athletes||[]).filter(a=>a.stats&&a.stats.length);if(!at.length||!c.labels)return;
  h+=`<div class="mut" style="margin-top:6px">${esc(c.text||c.name||'')}</div><table><tr><th></th>${c.labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>${at.map(a=>`<tr><td style="white-space:nowrap">${plink(lg,a.athlete&&a.athlete.id,a.athlete&&(a.athlete.shortName||a.athlete.displayName))}</td>${a.stats.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`});h+='</div>'});return h}
async function teamView(lgId,id){const lg=LG[lgId],box=document.getElementById('sheetIn');let h=top_()+`<div class="mut">${esc(lg.em+' '+lg.name)}</div>`;box.innerHTML=h+'<div class="empty">Loading…</div>';
 let st,ro;try{[st,ro]=await Promise.all([getJ(API+lg.path+'/teams/'+id+'/statistics',600e3),getJ(API+lg.path+'/teams/'+id+'/roster',3600e3)])}catch(e){box.innerHTML=h+'<div class="empty">Couldn\'t load team. Check your connection.</div>';return}
 const t=ro.team||st.team||{};const logo=t.logo||(t.logos&&t.logos[0]&&t.logos[0].href)||'';
 h+=`<div class="row"><img src="${esc(logo)}" style="width:44px;height:44px" alt=""><h2 class="n" style="margin:6px 0">${esc(t.displayName||'')}</h2><button class="star" data-fav='${esc(JSON.stringify({lg:lgId,id,displayName:t.displayName,logo}))}'>${isFav(lgId,id)?'★':'☆'}</button></div><div class="mut">${esc(t.recordSummary||'')}${t.standingSummary?' · '+esc(t.standingSummary):''}</div>`;
 const cats=st.results&&st.results.stats&&st.results.stats.categories||[];
 if(cats.length){h+=`<div class="sec">Season stats ${esc(st.season&&st.season.displayName||'')}</div>`+cats.map(c=>`<div class="card" style="padding:4px 8px"><b>${esc(c.displayName)}</b><table>${c.stats.filter(x=>x.displayValue!=null).slice(0,10).map(x=>`<tr><td>${esc(x.displayName)}</td><td style="text-align:right">${esc(x.displayValue)}</td><td class="mut" style="text-align:right">${x.rankDisplayValue?esc(x.rankDisplayValue):''}</td></tr>`).join('')}</table></div>`).join('')}
 else h+='<div class="mut card">No season stats yet.</div>';
 const groupsR=(ro.athletes||[]).length&&ro.athletes[0].items?ro.athletes:[{position:'Roster',items:ro.athletes||[]}];
 h+='<div class="sec">Roster</div>'+groupsR.map(gp=>`<div class="card" style="padding:4px 8px"><b style="text-transform:capitalize">${esc(gp.position)}</b><table>${gp.items.map(a=>`<tr><td>${plink(lgId,a.id,a.displayName)}</td><td class="mut">${esc(a.jersey?'#'+a.jersey:'')}</td><td class="mut">${esc(a.position&&a.position.abbreviation||'')}</td></tr>`).join('')}</table></div>`).join('');box.innerHTML=h}
async function playerView(lgId,id){const lg=LG[lgId],box=document.getElementById('sheetIn');let h=top_();box.innerHTML=h+'<div class="empty">Loading…</div>';
 let a,o;try{[a,o]=await Promise.all([getJ(WEB+lg.path+'/athletes/'+id,3600e3),getJ(WEB+lg.path+'/athletes/'+id+'/overview',600e3).catch(()=>({}))])}catch(e){box.innerHTML=h+'<div class="empty">Couldn\'t load player.</div>';return}
 const p=a.athlete||{};h+=`<div class="row">${p.headshot?`<img src="${esc(p.headshot.href)}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;background:#222" alt="">`:''}<div class="n"><h2 style="margin:4px 0">${esc(p.displayName)}</h2><div class="mut">${esc([p.jersey&&'#'+p.jersey,p.position&&p.position.displayName,p.team&&p.team.displayName].filter(Boolean).join(' · '))}</div><div class="mut">${esc([p.displayHeight,p.displayWeight,p.age&&'Age '+p.age,p.displayExperience||p.experience&&p.experience.displayValue].filter(Boolean).join(' · '))}</div></div></div>`;
 if(p.team&&p.team.id)h+=`<p>${tlink(lgId,p.team.id,'Team page ›')}</p>`;
 const st=o.statistics;if(st&&st.labels&&st.splits&&st.splits.length)h+=`<div class="sec">${esc(st.displayName||'Stats')}</div><div class="card" style="padding:4px 8px;overflow-x:auto"><table><tr><th></th>${st.labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>${st.splits.map(sp=>`<tr><td style="white-space:nowrap">${esc(sp.displayName)}</td>${sp.stats.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 else h+='<div class="mut card">No season stats available yet.</div>';
 const gl=o.gameLog&&o.gameLog.statistics&&o.gameLog.statistics[0];if(gl&&gl.events&&gl.events.length&&gl.labels)h+=`<div class="sec">Recent games</div><div class="card" style="padding:4px 8px;overflow-x:auto"><table><tr><th></th>${gl.labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>${gl.events.slice(0,5).map(e=>`<tr><td>${esc(e.eventId&&o.gameLog.events&&o.gameLog.events[e.eventId]?(o.gameLog.events[e.eventId].atVs+' '+o.gameLog.events[e.eventId].opponent.abbreviation):'')}</td>${(e.stats||[]).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 box.innerHTML=h}
function closeSheet(){STACK.length=0;document.getElementById('sheet').classList.remove('on')}
// ---- shell
const TABS=[['mine','⭐','My Teams'],['scores','🏟️','Scores'],['news','📰','News'],['stand','📊','Standings']];
function header(){const chips=S.tab==='mine'?'':`<div class="chips" id="lgs">${L.map(l=>`<button class="chip ${l.id===S.lg?'on':''}" data-lg="${l.id}">${l.em} ${esc(l.name)}</button>`).join('')}</div>`;
 const d=S.date?new Date(+S.date.slice(0,4),+S.date.slice(4,6)-1,+S.date.slice(6)):new Date();
 const bar=S.tab==='scores'?`<div class="bar"><button data-d="-1">‹</button><input type="date" id="dp" value="${d.toISOString?ymd(d).replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3'):''}"><button data-d="1">›</button><button data-d="0">Today</button></div>`:'';
 document.getElementById('hdr').innerHTML=chips+bar;document.getElementById('ttl').textContent=TABS.find(t=>t[0]===S.tab)[2];
 document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===S.tab?'on':''}" data-tab="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('');const on=document.querySelector('#lgs .on');on&&on.scrollIntoView({inline:'center',block:'nearest'})}
let seq=0;async function render(soft){const my=++seq;const app=document.getElementById('app');if(!soft){header();app.innerHTML='<div class="empty">Loading…</div>'}S.stale=null;
 let h;try{h=await({mine:vMine,scores:vScores,news:vNews,stand:vStand}[S.tab])()}catch(e){h=`<div class="empty">⚠️ Couldn't load data${navigator.onLine?'':' — you\'re offline'}.<br><br><button class="chip" onclick="render()">Retry</button></div>`;S.live=false}
 if(my!==seq)return;if(S.stale)h=`<div class="banner">${navigator.onLine?'Connection problem':'Offline'} — showing data from ${ago(S.stale)}</div>`+h;
 const y=scrollY;app.innerHTML=h;if(soft)scrollTo(0,y);document.getElementById('pl').innerHTML=S.live&&(S.tab==='scores'||S.tab==='mine')?'<span class="pulse" title="Live"></span>':'';
 document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});prune();schedule()}
let timer;function schedule(){clearTimeout(timer);if(document.visibilityState!=='visible')return;const ms=(S.tab==='scores'||S.tab==='mine')?(S.live?20e3:120e3):300e3;timer=setTimeout(()=>render(true),ms)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')render(true);else clearTimeout(timer)});
addEventListener('online',()=>render(true));
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-lg],[data-d],[data-g],[data-fav],[data-t],[data-p]');if(!t){if(e.target.id==='sheet')closeSheet();return}
 if(t.dataset.tab){S.tab=t.dataset.tab;ss('tab',S.tab);scrollTo(0,0);render()}else if(t.dataset.lg){S.lg=t.dataset.lg;ss('lg',S.lg);S.date=null;render()}
 else if(t.dataset.d){const v=+t.dataset.d;if(!v)S.date=null;else{const s=S.date||ymd(new Date());const d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6)+v);S.date=ymd(d)}render()}
 else if(t.dataset.fav){const f=JSON.parse(t.dataset.fav);toggleFav(f.lg,f);t.textContent=isFav(f.lg,f.id)?'★':'☆';if(S.tab!=='stand'&&!STACK.length)render(true)}
 else if(t.dataset.t){const[a,b]=t.dataset.t.split('|');openSheet(()=>teamView(a,b))}
 else if(t.dataset.p){const[a,b]=t.dataset.p.split('|');openSheet(()=>playerView(a,b))}
 else if(t.dataset.g)detail(t.dataset.g)});
document.addEventListener('change',e=>{if(e.target.id==='dp'&&e.target.value){S.date=e.target.value.replace(/-/g,'');render()}});
if(!LG[S.lg])S.lg='nfl';S.favs=S.favs.filter(f=>LG[f.lg]);render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
